version: '3.8'
services:
  postmessages_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
     - postmessages_backend
    networks:
      - taw
    profiles:
      - frontend

  postmessages_backend:
    build:
      context: ./backend/v3
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/mydatabase
    depends_on:
      - mymongo
    networks:
      - taw

  mymongo:
    image: mongo:6
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - taw


networks:
  taw:
    name: taw
    driver: bridge
    external: true

volumes:
  mongodb-data:
